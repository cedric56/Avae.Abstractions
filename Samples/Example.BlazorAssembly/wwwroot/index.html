<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example.BlazorAssembly</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Example.BlazorAssembly.styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/Avae.Razor/theme.css" rel="stylesheet" />

    <script type="importmap"></script>
</head>

<body>
    <div id="avalonia"></div><!-- We can't use same app -->
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(
                "_content/Avae.Blazor.Notifications/service-worker.js",
                { scope: "/" }
            );
        }
    </script>
    <!--<script src="_content/Avae.Blazor.Notifications/notifications.js"></script>
    <script src="_content/Avae.Blazor.Notifications/js/service-worker.js"></script>
    <script src="_content/Avae.Blazor.Notifications/js/service-worker-registration.js"></script>-->
</body>

</html>
